name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-validation:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test .NET projects
        run: dotnet test MateViewGuardian.slnx --configuration Release --nologo
      - name: Install Pester
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Test Windows helper
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $result = Invoke-Pester tests/windows -Output Detailed -PassThru
          if ($result.Result -ne 'Passed') { exit 1 }

  release:
    needs: windows-validation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify code and helpers
        run: |
          dotnet test MateViewGuardian.slnx --configuration Release --nologo
          sh tests/macos/mateview-hid-filter-test.sh
          sh tests/macos/install-test.sh
          sh tests/macos/fetch-ddc-test.sh
          sh tests/package-test.sh
          pwsh -NoProfile -Command '$result = Invoke-Pester tests/windows -Output Detailed -PassThru; if ($result.Result -ne "Passed") { exit 1 }'
      - name: Build release archives
        run: |
          sh scripts/package.sh dist
          sh scripts/package-gui.sh dist
      - name: Verify release archives
        run: |
          unzip -t dist/MateViewGuardian-macOS-arm64.zip
          unzip -t dist/MateViewGuardian-Windows-x64.zip
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/MateViewGuardian-macOS-arm64.zip
          dist/MateViewGuardian-Windows-x64.zip
          dist/SHA256SUMS.txt
          dist/mateview-fix-macos.zip
          dist/mateview-fix-windows.zip
          --generate-notes --title "$GITHUB_REF_NAME"
