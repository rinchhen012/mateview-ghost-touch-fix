name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify macOS and package behavior
        run: |
          sh tests/macos/mateview-hid-filter-test.sh
          sh tests/macos/install-test.sh
          sh tests/package-test.sh
      - name: Build release archives
        run: sh scripts/package.sh dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/mateview-fix-macos.zip dist/mateview-fix-windows.zip --generate-notes --title "$GITHUB_REF_NAME"
